<div class="clients-page">
  <header class="page-header">
    <div>
      <span class="eyebrow">Gestión de clientes</span>
      <h1>Clientes registrados</h1>
      <p class="page-subtitle">Administra la información de tus clientes.</p>
    </div>
    <button class="btn-primary" (click)="onCreate()">
      <span class="material-symbols-outlined">add</span>
      Nuevo cliente
    </button>
  </header>

  <section class="list-card">
    <div class="list-header">
      <div>
        <h2>Listado de clientes</h2>
        <span class="list-count">
          {{ filteredClients.length }}
          {{ filteredClients.length === 1 ? 'registro encontrado' : 'registros encontrados' }}
        </span>
      </div>

      <div class="search-box">
        <span class="material-symbols-outlined">search</span>
        <input
          type="text"
          placeholder="Buscar cliente..."
          (input)="onSearch($any($event.target).value)"
        />
      </div>
    </div>

    <app-generic-table
      [columns]="columns"
      [data]="filteredClients"
      [actions]="actions"
      [isLoading]="isLoading"
      emptyMessage="No se encontraron clientes"
      (rowAction)="onRowAction($event)"
    ></app-generic-table>
  </section>

  <div class="form-overlay" *ngIf="showForm">
    <div class="form-modal">
      <app-client-form
        [documentTypes]="documentTypes"
        [client]="editingClient"
        (save)="onFormSubmit($event)"
        (cancel)="onFormCancel()"
      ></app-client-form>
    </div>
    <div class="overlay-backdrop" (click)="onFormCancel()"></div>
  </div>
</div>
