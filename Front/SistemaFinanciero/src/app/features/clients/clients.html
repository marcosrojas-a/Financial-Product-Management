<div class="clients-page">
  <div class="page-header">
    <h1>Clientes</h1>
    <button class="btn-primary" (click)="onCreate()">Crear Cliente</button>
  </div>

  <app-generic-table
    [columns]="columns"
    [data]="clients"
    [actions]="actions"
    [isLoading]="isLoading"
    emptyMessage="No hay clientes registrados"
    (rowAction)="onRowAction($event)"
  ></app-generic-table>

  <div class="form-overlay" *ngIf="showForm">
    <div class="form-modal">
      <app-client-form
        [documentTypes]="documentTypes"
        [client]="editingClient"
        (save)="onFormSubmit($event)"
        (cancel)="onFormCancel()"
      ></app-client-form>
    </div>
    <div class="overlay-backdrop" (click)="onFormCancel()"></div>
  </div>
</div>
