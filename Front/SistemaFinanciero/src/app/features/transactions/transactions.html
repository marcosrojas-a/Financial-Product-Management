<div class="transactions-page">
  <div class="page-header">
    <h1>Transacciones</h1>
    <button class="btn-primary" (click)="onCreate()">Nueva Transacción</button>
  </div>

  <app-generic-table
    [columns]="columns"
    [data]="movements"
    [actions]="actions"
    [isLoading]="isLoading"
    emptyMessage="No hay movimientos registrados"
    (rowAction)="onRowAction($event)"
  ></app-generic-table>

  <div class="form-overlay" *ngIf="showForm">
    <div class="form-modal">
      <app-transaction-form
        (submit)="onFormSubmit($event)"
        (cancel)="onFormCancel()"
      ></app-transaction-form>
    </div>
    <div class="overlay-backdrop" (click)="onFormCancel()"></div>
  </div>
</div>
