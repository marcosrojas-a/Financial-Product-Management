<h2>Nueva Transacción</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="type-selector">
    <label class="type-label">Tipo de Transacción</label>
    <div class="type-options">
      <label class="type-option">
        <input type="radio" value="CONSIGNATION" formControlName="type" />
        <span>Consignación</span>
      </label>
      <label class="type-option">
        <input type="radio" value="WITHDRAWAL" formControlName="type" />
        <span>Retiro</span>
      </label>
      <label class="type-option">
        <input type="radio" value="TRANSFER" formControlName="type" />
        <span>Transferencia</span>
      </label>
    </div>
  </div>

  <div *ngIf="isConsignment() || isWithdrawal()" class="form-group">
    <label for="productId">Cuenta</label>
    <select id="productId" formControlName="productId" [disabled]="isLoading">
      <option value="" disabled selected>Seleccione una cuenta</option>
      <option *ngFor="let p of activeProducts" [ngValue]="p.id">
        {{ formatProductName(p) }}
      </option>
    </select>
  </div>

  <div *ngIf="isTransfer()">
    <div class="form-group">
      <label for="originProductId">Cuenta Origen</label>
      <select id="originProductId" formControlName="originProductId" [disabled]="isLoading">
        <option value="" disabled selected>Seleccione cuenta origen</option>
        <option *ngFor="let p of activeProducts" [ngValue]="p.id">
          {{ formatProductName(p) }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label for="destinationProductId">Cuenta Destino</label>
      <select id="destinationProductId" formControlName="destinationProductId" [disabled]="isLoading">
        <option value="" disabled selected>Seleccione cuenta destino</option>
        <option *ngFor="let p of activeProducts" [ngValue]="p.id">
          {{ formatProductName(p) }}
        </option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label for="amount">Valor</label>
    <input type="number" id="amount" formControlName="amount" placeholder="Ingrese el valor" min="1" step="0.01" />
    <div *ngIf="form.get('amount')?.invalid && (form.get('amount')?.dirty || form.get('amount')?.touched)" class="error">
      Debe ingresar un valor mayor a 0
    </div>
  </div>

  <div class="form-group">
    <label for="description">Descripción</label>
    <input type="text" id="description" formControlName="description" placeholder="Descripción opcional" />
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-submit">Guardar</button>
    <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
  </div>
</form>
